version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: viva_db
    environment:
      POSTGRES_USER: viva_user
      POSTGRES_PASSWORD: viva_password
      POSTGRES_DB: viva_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viva_user -d viva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viva_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: viva_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://viva_user:viva_password@db:5432/viva_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_prod
      - ENVIRONMENT=development
      - YOUPI_INTERNAL_API_URL=http://youpi:6100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  youpi:
    image: node:22-alpine
    container_name: viva_youpi
    working_dir: /app
    volumes:
      - ./youpi-pg:/app
    ports:
      - "6100:6100"
      - "7000:7000"
      - "8090:8090"
    environment:
      - YOUPI_ALLOW_LOCALHOST_MODE=true
      - YOUPI_MODE=localhost
      - YOUPI_BIND_HOST=0.0.0.0
      - CHECKOUT_FRAME_ANCESTORS=http://localhost:3000 http://localhost:8000 http://localhost
    restart: unless-stopped
    command: node run-gateway.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: viva_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: viva_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - youpi
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
